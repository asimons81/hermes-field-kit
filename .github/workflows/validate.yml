name: Validate repository

on:
  push:
    branches:
      - main
      - "hardening/**"
      - "skill/**"
      - "docs/**"
      - "tooling/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check pull-request diff whitespace
        if: github.event_name == 'pull_request' && runner.os == 'Linux' && matrix.python-version == '3.13'
        run: git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Test validator contract
        run: python -B -m unittest discover -s tests -v
      - name: Validate repository
        run: python scripts/validate.py
      - name: Validate published skills and public tree
        run: python -B scripts/validate_release_wave.py
